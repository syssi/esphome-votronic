substitutions:
  name: votronic-solar-charger
  device_description: "Monitor a Votronic Solar Charger via the display link port (UART)"
  external_components_source: github://syssi/esphome-votronic@main
  tx_pin: GPIO4
  rx_pin: GPIO5
  rx_timeout: 150ms

esphome:
  name: ${name}
  friendly_name: ${name}
  comment: ${device_description}
  project:
    name: "syssi.esphome-votronic"
    version: 3.4.0

esp8266:
  board: d1_mini

external_components:
  - source: ${external_components_source}
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

ota:
  platform: esphome

logger:

# If you use Home Assistant please remove this `mqtt` section and uncomment the native `api` component!
# api:

mqtt:
  broker: !secret mqtt_host
  username: !secret mqtt_username
  password: !secret mqtt_password
  id: mqtt_client

uart:
  - id: uart_0
    baud_rate: 1000
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}

votronic:
  - id: votronic0
    uart_id: uart_0
    rx_timeout: ${rx_timeout}
    throttle: 2s

binary_sensor:
  - platform: votronic
    votronic_id: votronic0
    battery_computer_charging:
      name: "battery computer charging"
    battery_computer_discharging:
      name: "battery computer discharging"

sensor:
  - platform: votronic
    votronic_id: votronic0
    battery_computer_battery_voltage:
      name: "battery computer battery voltage"
    battery_computer_secondary_battery_voltage:
      name: "battery computer secondary battery voltage"
    battery_computer_battery_capacity_remaining:
      name: "battery computer battery capacity remaining"
    battery_computer_current:
      name: "battery computer current"
    battery_computer_power:
      name: "battery computer power"
    battery_computer_battery_nominal_capacity:
      name: "battery computer battery nominal capacity"
    battery_computer_battery_charge:
      name: "battery computer battery charge"
    charger_mode_setting_id:
      name: "charger mode setting id"
    battery_computer_battery_status_bitmask:
      name: "battery computer battery status bitmask"

text_sensor:
  - platform: votronic
    votronic_id: votronic0
    charger_mode_setting:
      name: "charger mode setting"
    battery_computer_battery_status:
      name: "battery computer battery status"
